# Every key the system understands lives here with a documented default.
# Override per mode in profiles/, per school in site.yaml, per run with --set.
# Nothing in the code may hardcode a value that belongs in this file.

runtime:
  # debug  - raw diagnostics, fail fast, writes to the scratch tenant
  # user   - clean output, recover from errors, writes to the real tenant
  mode: user

  # Default language for the robot when a class does not specify one.
  locale: en

  log_level: INFO

  # console  - human lines in user mode, structured lines in debug
  # jsonl    - machine-readable file for after-the-fact analysis
  sinks:
    - console

  log_dir: data/logs

  # How many recent events the bus keeps for late subscribers and the
  # debug overlay. Raise it if the diagnostics view looks truncated.
  event_replay_size: 512

  # Vision publishes on every detect cycle. Keeping it out of the session log
  # stops thousands of frame events burying the ones a report reads.
  log_event_exclude: ["vision.*"]

  # Debug mode sets this true so a broken handler surfaces immediately.
  # User mode sets it false so a demo survives one bad subscriber.
  raise_on_handler_error: true

tenancy:
  # Which org, school and class this robot belongs to. A school chain or a
  # CSR programme is one org; a campus is one school.
  org_id: lomas-demo
  school_id: sunrise-nashik
  class_id: grade-6b

  # Bench testing writes here instead, so fake students never appear in a
  # pilot school's dashboard.
  scratch_org_id: scratch

storage:
  # sqlite - a file on the robot, which is also what offline schools need
  # memory - nothing on disk, used by tests and dry runs
  backend: sqlite
  path: data/lomas.db

  # Session detail older than this is purged. Aggregates survive.
  retention_days: 180
  purge_on_term_end: true

  busy_timeout_ms: 5000

# A LIST, deliberately, even with one camera. Adding a classroom CCTV feed
# or a second angle later is an entry here plus nothing else.
sources:
  - id: head
    kind: mock            # picamera2 | usb | rtsp | file | folder | mock
    zone: front
    enabled: true
    width: 1280           # 720p: recognition needs ~80px of face width, which
    height: 720           # this gives you out to about 2 m
    fps: 15
    zoom: 1.0             # 1.0-2.5, a centred crop of the sensor
    rotation: 0
    loop: true            # replay sources start over at the end

vision:
  # Ring depth per source. When it is full the oldest frame goes, so a slow
  # consumer loses frames instead of stalling the camera.
  buffer_size: 4
  read_timeout_ms: 200

  # Frames in, tracks out. Turn this off and the class still runs; attendance
  # falls back to the roster and the robot addresses the room.
  pipeline:
    enabled: true
    source: ""             # empty means the first enabled camera above
    publish_tracks: true
    idle_sleep_seconds: 0.01
    join_timeout_seconds: 2.0

    # Give up after this many failed cycles in a row. Vision stopping is not
    # the class stopping; attendance falls back and the lesson carries on.
    max_consecutive_errors: 5

face:
  enabled: true
  detector: yunet          # yunet | mediapipe | mock
  model_path: models/face_detection_yunet_2023mar.onnx

  # Detection runs slower than capture, deliberately. Faces do not move fast
  # enough to need 15 Hz and the spare cores are wanted elsewhere.
  detect_fps: 10
  downscale_width: 640     # detect on this; crop faces from the full frame

  min_confidence: 0.6
  nms_threshold: 0.3
  top_k: 50
  min_face_px: 40          # detection floor; recognition needs about 80
  max_tracks: 8

  track_iou_threshold: 0.35
  track_birth_hits: 3      # frames before a track is treated as real
  track_death_seconds: 1.5

  # Calibration for the geometric pose estimate. Turn these if the attention
  # cone feels wrong in a real classroom.
  pose:
    yaw_scale_degrees: 60.0
    pitch_scale_degrees: 60.0
    pitch_neutral: 0.5


  # Recognition. Identity is resolved when a track is new and then carried by
  # the tracker, so the embedder runs once or twice per child per minute
  # rather than fifteen times a second.
  embedder: arcface_onnx        # arcface_onnx | mock
  embedder_model_path: models/mobilefacenet.onnx
  embedding_dim: 512
  match_threshold: 0.38         # cosine distance; lower is stricter
  reverify_seconds: 20.0        # re-check an established track occasionally
  unknown_after_attempts: 3     # then stop spending CPU on a stranger
  recognition_min_face_px: 80   # below this the crop is too poor to match
  crop_margin: 0.2

attention:
  enabled: true

  # Inside this cone the child counts as facing the robot.
  cone_yaw_degrees: 35.0
  cone_pitch_degrees: 25.0

  # Time constant of the score, not a frame count, so a variable frame rate
  # does not change how quickly someone reads as drifting.
  window_seconds: 10.0
  threshold: 0.45

  min_duration_seconds: 6.0
  cooldown_seconds: 120.0      # per student
  max_nudges_per_session: 3    # a robot that nudges more than this is nagging
enrolment:
  sweep_seconds: 4.0
  sample_frames: 15
  keep_best: 3                  # variant vectors kept per head angle
  min_quality: 0.5
  min_face_px: 96               # enrolment needs a bigger face than detection
  required_angles: [left, centre, right]
  angle_yaw_degrees: 20.0       # boundary between the angle buckets
  sharpness_reference: 120.0    # Laplacian variance treated as fully sharp
  crop_margin: 0.2

  # The consent row that has to exist before a single vector is written.
  consent_kind: face_recognition

  # An enrolment left half finished must not hold a child's vectors in
  # memory until the robot is switched off.
  abandoned_after_seconds: 120.0

privacy:
  # false makes the robot address the room instead of a child. Everything
  # else still works, which is what a school that will not consent needs.
  recognition_enabled: true
  require_consent: true

  # Not a switch. Enrolment embeds and discards in the same call, and the
  # database has no column for a picture, so this cannot be turned on.
  store_images: false

  store_attention_detail: false

speech:
  wake:
    enabled: true
    engine: openwakeword    # openwakeword | porcupine | keyboard
    phrase: "hey lomas"
    sensitivity: 0.6
    model_path: models/wake/hey_lomas.onnx
    zone: front
    access_key_env: PICOVOICE_ACCESS_KEY   # porcupine only

  stt:
    engine: groq            # groq | vosk | keyboard
    fallback_engine: vosk   # when the school's internet is gone
    # Quote language codes in this file. Unquoted, YAML reads `no` as false
    # (it is the code for Norwegian) and would silently break that language.
    language: "en"
    model: whisper-large-v3-turbo
    model_path: models/vosk # one directory per language
    api_base: https://api.groq.com/openai/v1

    # The name of the variable is config; the secret itself never is.
    api_key_env: GROQ_API_KEY

    sample_rate: 16000
    silence_timeout_ms: 1200
    max_utterance_seconds: 20
    timeout_seconds: 15.0

  tts:
    engine: piper           # piper | gtts | null
    rate: 1.0

    # A voice per language, never one voice string. This is what keeps adding
    # a language content work instead of code work.
    voice:
      en: en_US-lessac-medium
      hi: hi_IN-pratham-medium
    fallback_language: en
    binary: piper
    model_dir: models/piper
    scratch_file: data/tts-out.mp3

  audio:
    # A list, like sources. Per-desk microphones become entries here.
    inputs:
      - id: main
        device: default
        zone: front
    output: default

    # Mute the mic while speaking. Cheap, and it removes the two failures
    # that actually bite: transcribing our own voice, and self-triggering
    # the wake word.
    half_duplex: true
    tail_ms: 250

llm:
  # offline is the default so the whole system runs with no API key at all,
  # and so a school whose internet drops mid-lesson keeps teaching.
  provider: offline           # offline | groq | anthropic | openai
  model: ""                   # empty means the endpoint's own default
  fallback_provider: offline  # on timeout, rate limit, or no connection

  temperature: 0.4            # ignored by anthropic, which rejects sampling
  max_tokens: 1024
  timeout_seconds: 12.0
  retries: 2
  stream: true

  # Every prompt lives here, keyed by language. None of it may move into code.
  prompts_path: config/prompts
  fallback_language: en
  offline_faq: offline

  endpoints:
    groq:
      api_base: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model: llama-3.3-70b-versatile
    anthropic:
      api_base: https://api.anthropic.com/v1
      api_key_env: ANTHROPIC_API_KEY
      model: claude-opus-5
      # Opus 5 rejects temperature; effort is how depth is tuned instead.
      # low keeps classroom answers quick.
      effort: low
      server_side_fallback: true
    openai:
      api_base: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini

  router:
    enabled: true
    long_sentence_words: 25
    reasoning_keywords: [why, how, explain, compare, prove, derive]
    weight_length: 1
    weight_keywords: 1
    weight_multipart: 1
    medium_at: 2
    complex_at: 3

    # One model per question. Chaining them multiplies latency and cost.
    simple_provider: groq
    medium_provider: groq
    complex_provider: anthropic

flow:
  # Reordering or dropping a stage is an edit here, never a code change.
  sequence: [attendance, greeting, lesson, interaction, quiz, wrapup]

  stage_timeout_seconds:
    attendance: 120.0
    greeting: 30.0
    lesson: 900.0
    interaction: 420.0
    quiz: 300.0
    wrapup: 90.0
  default_timeout_seconds: 300.0

  tick_seconds: 0.25
  pause_poll_seconds: 0.1

  questions_per_lesson: 6
  answer_wait_seconds: 20.0   # move on if nobody answers
  quiz_length: 6
  pass_mark: 0.6

  # Until vision is wired in, and wherever recognition is switched off, the
  # class list stands in for recognised faces so the lesson still has names.
  attendance_falls_back_to_roster: true

# Each agent has one narrow job, its own prompt and its own model. The safety
# filter does not need the model that teaches.
# Two surfaces on one Pi. The 7-inch chest panel is the robot's face and
# cannot carry lesson text a class can read; the second HDMI port drives a
# classroom TV or projector for that.
# The body. Off by default, because most of the time there is not one.
#
# The Pi sends intent and the ESP32 does execution: keyframe interpolation,
# sensor polling, and the e-stop, cliff and tilt cut-outs. No servo angle and
# no safety threshold appears here or in any .py file - those live in
# config/hardware/ and are applied on the board, in an interrupt.
hardware:
  enabled: false
  backend: simulator      # simulator | esp32. Switching is only this line.

  port: /dev/ttyUSB0
  baud: 921600
  timeout_seconds: 0.2
  telemetry_hz: 20

  config_path: config/hardware
  gesture_speed: 100

  log_frames: true        # the exact bytes, for comparing against the board
  simulate_travel_time: true
  simulated_battery_mv: 12000

  # A robot whose head follows children is not something to switch on without
  # asking a school first.
  look_at_enabled: true
  look_at_min_degrees: 6.0   # deadband, so the head does not snap about

  # Event to gesture. Adding one is a line here, never a change in code.
  gestures:
    session.opened: namaste
    session.closed: namaste
    question.asked: thinking
    quiz.marked: celebrate

# The diagnostics overlay. Served in debug mode and nowhere else - it is a
# panel for engineers, not a screen for children.
debug:
  enabled: true
  rate_window_seconds: 5.0
  rate_samples: 200
  rate_events: [vision.tracks, robot.say, student.identified]

  # Event pairs to time. Adding one - a wake word to its transcript, once
  # there is a microphone loop - is a line here rather than a code change.
  latencies:
    speak: [robot.say, robot.spoke]
    answer: [question.asked, question.answered]
    marking: [quiz.recorded, quiz.marked]

  keep_samples: 20
  keep_events: 200
  tracks_event: vision.tracks
  noisy_events: [vision.tracks]     # ten a second would bury everything else

  # Empty means unpriced, and the panel says so rather than inventing a
  # number. Keys are model ids, values are [input, output] per million tokens.
  cost_per_million: {}
  currency: USD

  poll_seconds: 1.0

# The screen that decides whether teachers keep using the product.
teacher:
  enabled: true
  recent_sessions: 10

  # Not a switch. There is no code path that puts an attention score in a
  # report and no key for one, so this cannot be turned on.
  report_shows_attention: false

display:
  face_screen:
    enabled: true
    output: ""
    width: 1024
    height: 600
    scale: 1.0

  board_screen:
    enabled: false          # turn on where the room has a projector
    output: HDMI-2
    width: 1920
    height: 1080
    scale: 1.0

  # Where text starts on the face panel. Absurd on a laptop over VNC, about
  # right on a 7-inch screen seen from a metre and a half.
  base_font_px: 32

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  surfaces: [face, board, teacher]

  # The stream is the camera as it is. Boxes are HTML over the video, never
  # painted into the frame - that would cost a decode and re-encode per frame.
  mjpeg_quality: 70
  mjpeg_fps: 15
  mjpeg_source: ""          # empty means the camera the pipeline is using

  # Per browser. When it is full the oldest event goes: a tab left open on a
  # locked laptop must never slow the lesson down.
  client_queue: 64
  ping_seconds: 20.0
  event_filter: ["*"]
  shutdown_seconds: 2.0

agents:
  # Remove a name and that agent is gone. Nothing else changes.
  enabled: [tutor, quizmaster, narrator, engagement, safety]

  settings:
    # provider and model empty means inherit llm.*, so one agent can be
    # pinned to a cheap fast model without touching the others.
    tutor:      {provider: "", model: "", prompt: tutor}
    quizmaster: {provider: "", model: "", prompt: quizmaster, prompts: {mark: marking}}
    narrator:   {provider: "", model: "", prompt: narrator}
    engagement: {provider: "", model: "", prompt: nudge}
    safety:     {provider: "", model: "", prompt: safety}

  safety:
    # Runs with no model and no internet, so it is the only check a school
    # can count on being there. Empty by default: what a board wants blocked
    # is their decision, not ours.
    blocked_terms: []

    # The model check is better and costs a round trip on every line spoken.
    use_model: false
    allow_token: ALLOW
    block_token: BLOCK

    # A verdict that is neither word means the model is unusable for this.
    # A robot that falls silent mid-lesson is a failed class.
    fail_open: true

# What an agent is allowed to see. Every number here narrows it.
context:
  mcp_enabled: true
  history_turns: 8
  lesson_window: 3            # taught segments an agent may see, not the whole lesson
  include_student_profile: true
  recent_answers: 5

content:
  language: "en"
  grade: "6"
  subject: science
  vocabulary_level: middle    # primary | middle | secondary
  pack_path: content
  default_topic: photosynthesis
