# Every key the system understands lives here with a documented default.
# Override per mode in profiles/, per school in site.yaml, per run with --set.
# Nothing in the code may hardcode a value that belongs in this file.

runtime:
  # debug  - raw diagnostics, fail fast, writes to the scratch tenant
  # user   - clean output, recover from errors, writes to the real tenant
  mode: user

  # Default language for the robot when a class does not specify one.
  locale: en

  log_level: INFO

  # console  - human lines in user mode, structured lines in debug
  # jsonl    - machine-readable file for after-the-fact analysis
  sinks:
    - console

  log_dir: data/logs

  # How many recent events the bus keeps for late subscribers and the
  # debug overlay. Raise it if the diagnostics view looks truncated.
  event_replay_size: 512

  # Debug mode sets this true so a broken handler surfaces immediately.
  # User mode sets it false so a demo survives one bad subscriber.
  raise_on_handler_error: true

tenancy:
  # Which org, school and class this robot belongs to. A school chain or a
  # CSR programme is one org; a campus is one school.
  org_id: lomas-demo
  school_id: sunrise-nashik
  class_id: grade-6b

  # Bench testing writes here instead, so fake students never appear in a
  # pilot school's dashboard.
  scratch_org_id: scratch

storage:
  # sqlite - a file on the robot, which is also what offline schools need
  # memory - nothing on disk, used by tests and dry runs
  backend: sqlite
  path: data/lomas.db

  # Session detail older than this is purged. Aggregates survive.
  retention_days: 180
  purge_on_term_end: true

  busy_timeout_ms: 5000

# A LIST, deliberately, even with one camera. Adding a classroom CCTV feed
# or a second angle later is an entry here plus nothing else.
sources:
  - id: head
    kind: mock            # picamera2 | usb | rtsp | file | folder | mock
    zone: front
    enabled: true
    width: 1280           # 720p: recognition needs ~80px of face width, which
    height: 720           # this gives you out to about 2 m
    fps: 15
    zoom: 1.0             # 1.0-2.5, a centred crop of the sensor
    rotation: 0
    loop: true            # replay sources start over at the end

vision:
  # Ring depth per source. When it is full the oldest frame goes, so a slow
  # consumer loses frames instead of stalling the camera.
  buffer_size: 4
  read_timeout_ms: 200

face:
  enabled: true
  detector: yunet          # yunet | mediapipe | mock
  model_path: models/face_detection_yunet_2023mar.onnx

  # Detection runs slower than capture, deliberately. Faces do not move fast
  # enough to need 15 Hz and the spare cores are wanted elsewhere.
  detect_fps: 10
  downscale_width: 640     # detect on this; crop faces from the full frame

  min_confidence: 0.6
  nms_threshold: 0.3
  top_k: 50
  min_face_px: 40          # detection floor; recognition needs about 80
  max_tracks: 8

  track_iou_threshold: 0.35
  track_birth_hits: 3      # frames before a track is treated as real
  track_death_seconds: 1.5

  # Calibration for the geometric pose estimate. Turn these if the attention
  # cone feels wrong in a real classroom.
  pose:
    yaw_scale_degrees: 60.0
    pitch_scale_degrees: 60.0
    pitch_neutral: 0.5

attention:
  enabled: true

  # Inside this cone the child counts as facing the robot.
  cone_yaw_degrees: 35.0
  cone_pitch_degrees: 25.0

  # Time constant of the score, not a frame count, so a variable frame rate
  # does not change how quickly someone reads as drifting.
  window_seconds: 10.0
  threshold: 0.45

  min_duration_seconds: 6.0
  cooldown_seconds: 120.0      # per student
  max_nudges_per_session: 3    # a robot that nudges more than this is nagging
