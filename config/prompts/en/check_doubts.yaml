# Said after an idea, before the next one. This is the whole of what makes
# the class two-way: one idea, then the room gets it back.
#
# Open, and short enough that a child who has nothing to say is not made to
# sit through a speech before the lesson carries on.

lines:
  - "Does that make sense? Ask me anything about it."
  - "Any doubts so far?"
  - "Is that clear? Say it now if it is not."
  - "Anything you want me to say again?"
