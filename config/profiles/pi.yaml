# On the robot.
#
# Everything not listed here is inherited from default.yaml. That is the point
# of this file: moving from a laptop to the Pi is a config change and nothing
# else, and this is the whole of the change.

runtime:
  mode: user            # quiet output, and a bad subscriber must not end a lesson
  log_level: INFO
  sinks: [console, jsonl]

# A robot boots, shows a sleeping face and waits for the teacher to begin.
flow:
  autostart: false

sources:
  - id: head
    kind: picamera2     # sudo apt install -y python3-picamera2
    zone: front
    width: 1280         # 720p: recognition needs ~80px of face width, which
    height: 720         # this gives you out to about 2 m
    fps: 15
    zoom: 1.0

    controls:
      # Auto-exposure needs real frames before it settles. Grabbing straight
      # after start is why a good sensor gives a dark picture.
      warmup_seconds: 2.5

      auto_exposure: true
      auto_white_balance: true

      # Stops of compensation. Raise this first for a dim classroom - +1.0 is
      # twice the light, and costs only a little noise. Try 1.0 then 2.0.
      exposure_value: 0.0

      # Both zero lets auto-exposure choose. Set them only to pin it.
      exposure_time_us: 0
      analogue_gain: 0.0

      brightness: 0.0     # -1 to 1, on top of exposure
      contrast: 1.0
      saturation: 1.0

face:
  # Measured: YuNet at 640 wide costs about 28 ms on a Pi 4 core, so eight a
  # second is roughly a fifth of one core. Chromium is the expensive process
  # here, not this.
  detect_fps: 8
  downscale_width: 640

vision:
  pipeline:
    enabled: true

web:
  host: 0.0.0.0         # so a teacher's tablet can reach it over the room wifi
  port: 8080
  surfaces: [face, board, teacher]
  mjpeg_fps: 12         # about a quarter of a core at 720p

display:
  # The robot draws its own face. Chromium showing one face costs this Pi
  # several hundred megabytes and a steady share of a core the detector
  # wants; pygame costs about fifty. sudo apt install -y python3-pygame
  face_screen:  {enabled: true,  width: 1024, height: 600, surface: pygame}
  board_screen: {enabled: true,  output: HDMI-2, width: 1920, height: 1080}

speech:
  tts:
    # Local, has the Indic voices, and loaded once. The `piper` command cost
    # six seconds loading per paragraph on a Pi 4 before a sound was made.
    engine: piper_python
    player: auto        # picks aplay on Raspberry Pi OS
    model_dir: models/piper

    # A Pi has four playback cards - the jack, two HDMI, often a DAC - and
    # ALSA's `default` is rarely the one with a speaker on it. Find the jack
    # with `aplay -l`. By name, never by number: the numbers are handed out
    # at boot and moved on a real Pi, which left plughw:0,0 pointing at an
    # HDMI port ("audio open error: Unknown error 524") and the robot mute.
    # `aplay -l` on this robot lists four: the jack (Headphones), two HDMI
    # ports and an i2s DAC. A tone played at the wrong one is accepted,
    # reported as fine, and heard by nobody - which is what silence with no
    # error means. Check with, in order:
    #     aplay -D plughw:CARD=Headphones,DEV=0 /usr/share/sounds/alsa/Front_Center.wav
    #     aplay -D plughw:CARD=i2smasterdac,DEV=0 /usr/share/sounds/alsa/Front_Center.wav
    player_device: plughw:CARD=Headphones,DEV=0

    # The jack has a real mixer, so the slider moves that rather than
    # scaling samples: it is louder at the top and quieter at the bottom
    # than anything software can do, and whatever else plays obeys it too.
    volume:
      # Loud, because this card is not. `amixer` on the Pi's jack maps its
      # percentage across a range from -102 dB to +4 dB, so the 0.8 that
      # sounds like a sensible default came out at -17 dB - a seventh of
      # the amplitude, which under a fan is nothing at all.
      #
      # This is the level a robot starts at, once. After that the buttons
      # on its face and the teacher's slider own it, and what they choose
      # is remembered in data/volume.json - which wins over this line.
      level: 1.0

      # auto, not alsa: this Pi has four playback cards and only the
      # headphone jack has a mixer on it. Pointed at an i2s DAC or an HDMI
      # port, `alsa` would find no knob and the slider would move nothing;
      # auto uses the card's own mixer where there is one and scales the
      # samples where there is not.
      control: auto

  stt:
    engine: groq        # whisper, covered by the same key as the tutor
    fallback_engine: vosk

  audio:
    recorder: auto      # picks arecord, which Raspberry Pi OS already has
    # A USB microphone is rarely the default input. Find yours with
    #     arecord -l
    # and put it here by name, plughw:CARD=<name>,DEV=0 - card numbers change
    # between boots. Leaving this empty records
    # from whatever ALSA calls default, which is usually the wrong thing.
    device: ""
    sample_rate: 16000  # what whisper wants
    record_seconds: 15.0        # the longest a child may speak
    stop_after_silence_ms: 1200 # ...and it stops this long after they finish
    no_speech_seconds: 5.0

    # Measured on this robot with the fan running, by
    # `python tools/audio_check.py --mode pi --turn`: the room sat at 0.0127
    # against a voice at 0.0595, and subtracting the low frequencies took
    # that separation from 1.5x to 4.2x. A fan is almost all low frequency;
    # a voice is not.
    rumble_samples: 20
    smooth_samples: 1

enrolment:
  # The robot introduces itself to a face it does not know and enrols them
  # there and then, so nothing about this robot needs a laptop. A school
  # that wants a teacher to approve every enrolment sets this false.
  by_voice: true

# A hand held up, meaning "I would like to ask something". Who raised it
# comes from the face beside it.
#
# raised_hand and not mediapipe: mediapipe's aarch64 wheel is built for a
# processor with AES instructions and this Pi has none, so importing it
# aborts the whole process - "FATAL ERROR: compiled with aes enabled".
# raised_hand needs no wheel and no model, knows one thing, and that one
# thing is all this robot ever wanted a hand for.
#
#     python tools/doctor.py --mode pi        # can this machine do it
#     python tools/signs_check.py --mode pi   # what it costs, and how far
signs:
  enabled: true
  fps: 3.0                # a hand is held up for seconds; this is plenty
  hands:
    reader: raised_hand
    every: 1              # one read in this many - the first dial to turn
  cards:
    # Off, because it is not free on this machine. Measured by
    # `tools/signs_check.py --mode pi`: reading markers costs 41 ms a frame
    # here against 2.4 on a laptop, which at three reads a second is an
    # eighth of a core spent looking for cards nobody has printed.
    #
    # `reader: aruco` the day a sheet comes off a printer.
    reader: none

# On while the robot is being worked on. The runtime log is deliberately
# not committed - it is large and full of noise - so a run with the trace
# off leaves nothing for anybody to read afterwards, which makes `sync`
# push nothing and a question like "why was it silent?" unanswerable.
# Turn it off once the robot is living in a school.
trace:
  enabled: true

# Every audio, latency and face fix so far came out of a trace pushed from
# this Pi by hand. A robot in a classroom has nobody to type three git
# commands after a class, so it files its own: at the end of every class, and
# when it is switched off. Only data/logs is touched.
sync:
  enabled: true
  "on": [session_closed, shutdown]

hardware:
  enabled: true
  backend: esp32        # pip install pyserial
  port: /dev/ttyUSB0
  baud: 921600
