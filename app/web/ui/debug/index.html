<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomas diagnostics</title>
<link rel="stylesheet" href="debug.css">
</head>
<body>

<header>
  <b>lomas diagnostics</b>
  <span id="mode"></span>
  <span id="uptime"></span>
  <span id="poll">connecting</span>
</header>

<main>

  <section class="card" id="visionCard">
    <h2>vision</h2>
    <dl id="vision"></dl>
  </section>

  <section class="card">
    <h2>host</h2>
    <div id="cores"></div>
    <dl id="host"></dl>
    <div id="throttle"></div>
  </section>

  <section class="card">
    <h2>latency</h2>
    <table id="latency"></table>
  </section>

  <section class="card wide">
    <h2>tracks</h2>
    <table id="tracks"></table>
  </section>

  <section class="card">
    <h2>event rates</h2>
    <table id="rates"></table>
  </section>

  <section class="card">
    <h2>plugins</h2>
    <dl id="plugins"></dl>
  </section>

  <section class="card wide">
    <h2>model calls</h2>
    <div id="llmTotals"></div>
    <div id="llm"></div>
  </section>

  <section class="card wide">
    <h2>events</h2>
    <div id="events"></div>
  </section>

</main>

<script src="debug.js"></script>
</body>
</html>
